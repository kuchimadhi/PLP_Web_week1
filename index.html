<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="page-header">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main>
        <section class="expense-section" id="add-expense">
            <h2>Add Expense</h2>

            <label for="expense-name">Expense Name</label>
            <input type="text" id="expense-name" name="expense-name" placeholder="e.g. Groceries">

            <label for="expense-amount">Amount</label>
            <input type="number" id="expense-amount" name="expense-amount" placeholder="e.g. 2500">

            <label for="expense-category">Category</label>
            <input type="text" id="expense-category" name="expense-category" placeholder="e.g. Food">
        </section>

        <section class="expenses-placeholder" id="your-expenses">
            <h2>Your Expenses</h2>
            <p>No expenses yet.</p>
        </section>
    </main>
</body>
</html>
